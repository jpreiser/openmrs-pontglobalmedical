name: Build & Deploy OpenMRS

on:
  push:
    branches:
      - master
  workflow_dispatch:  # Allow manual trigger from GitHub UI

env:
  JAVA_VERSION: '21'
  TOMCAT_WEBAPPS: '/var/lib/tomcat10/webapps'
  TOMCAT_SERVICE: 'tomcat10'
  BACKUP_DIR: '/home/ubuntu/db-backups'
  DB_NAME: 'server'
  DB_USER: 'root'
  AWS_REGION: 'us-east-1'  # Change to your EC2's region if different

permissions:
  id-token: write   # Required for OIDC token generation
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build the WAR file
  # ─────────────────────────────────────────────
  build:
    name: Build OpenMRS WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests --batch-mode

      - name: Find and stage WAR
        run: |
          WAR_PATH=$(find . -name "*.war" | head -1)
          echo "Found WAR at: $WAR_PATH"
          cp "$WAR_PATH" openmrs.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmrs-war
          path: openmrs.war
          retention-days: 5

  # ─────────────────────────────────────────────
  # JOB 2: Backup DB, then deploy via SSM
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    environment: production  # Optional: adds a manual approval gate in GitHub

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: openmrs-war

      # ── Authenticate to AWS via OIDC (no long-lived keys) ────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/pontmedical-openmrs-github-actions 
          aws-region: ${{ env.AWS_REGION }}

      # ── STEP 1: Database backup BEFORE any code changes ──────────────────
      - name: Backup MySQL database via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "OpenMRS pre-deploy DB backup" \
            --parameters commands="[
              \"set -e\",
              \"TIMESTAMP=\$(date +%Y%m%d_%H%M%S)\",
              \"BACKUP_FILE=${{ env.BACKUP_DIR }}/openmrs_pre_deploy_\${TIMESTAMP}.sql\",
              \"mkdir -p ${{ env.BACKUP_DIR }}\",
              \"echo Dumping database ${{ env.DB_NAME }}...\",
              \"mysqldump -u ${{ env.DB_USER }} --single-transaction --quick --routines --triggers ${{ env.DB_NAME }} > \${BACKUP_FILE}\",
              \"echo Backup size: \$(du -sh \${BACKUP_FILE} | cut -f1)\",
              \"ls -t ${{ env.BACKUP_DIR }}/*.sql 2>/dev/null | tail -n +8 | xargs rm -f || true\",
              \"echo DB backup complete\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "BACKUP_COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Backup MySQL database via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "OpenMRS pre-deploy DB backup" \
            --parameters 'commands=["mkdir -p /home/ubuntu/db-backups","TIMESTAMP=$(date +%Y%m%d_%H%M%S)","BACKUP_FILE=/home/ubuntu/db-backups/openmrs_pre_deploy_${TIMESTAMP}.sql","mysqldump -u root --single-transaction --quick --routines --triggers server > ${BACKUP_FILE}","echo Backup size: $(du -sh ${BACKUP_FILE} | cut -f1)","ls -t /home/ubuntu/db-backups/*.sql 2>/dev/null | tail -n +8 | xargs rm -f || true","echo DB backup complete"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll manually instead of using waiter so we can print errors
          for i in {1..20}; do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: Status = $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✓ Backup completed successfully"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "✗ Backup failed with status: $STATUS"
              echo "=== STDOUT ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
          done

          echo "✗ Timed out waiting for backup"
          exit 1
      # ── STEP 2: Upload WAR to S3, pull it down on EC2 ────────────────────
      # SSM doesn't support file transfer directly, so we stage via S3
      - name: Upload WAR to S3 staging bucket
        run: |
          aws s3 cp openmrs.war s3://${{ secrets.S3_DEPLOY_BUCKET }}/openmrs-deploy/openmrs.war
          echo "✓ WAR staged to S3"

      # ── STEP 3: Pull WAR from S3 on EC2 and deploy ───────────────────────
      - name: Deploy WAR via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "OpenMRS WAR deploy" \
            --parameters commands="[
              \"set -e\",
              \"echo Downloading WAR from S3...\",
              \"aws s3 cp s3://${{ secrets.S3_DEPLOY_BUCKET }}/openmrs-deploy/openmrs.war /tmp/openmrs_new.war\",
              \"echo Stopping Tomcat...\",
              \"sudo systemctl stop ${{ env.TOMCAT_SERVICE }}\",
              \"echo Swapping WAR...\",
              \"sudo rm -rf ${{ env.TOMCAT_WEBAPPS }}/openmrs\",
              \"sudo rm -f ${{ env.TOMCAT_WEBAPPS }}/openmrs.war\",
              \"sudo cp /tmp/openmrs_new.war ${{ env.TOMCAT_WEBAPPS }}/openmrs.war\",
              \"sudo chown tomcat:tomcat ${{ env.TOMCAT_WEBAPPS }}/openmrs.war\",
              \"rm -f /tmp/openmrs_new.war\",
              \"echo Starting Tomcat...\",
              \"sudo systemctl start ${{ env.TOMCAT_SERVICE }}\",
              \"sleep 60\",
              \"STATUS=\$(systemctl is-active ${{ env.TOMCAT_SERVICE }})\",
              \"echo Tomcat status: \$STATUS\",
              \"[ \\\"\$STATUS\\\" = \\\"active\\\" ] || (journalctl -u ${{ env.TOMCAT_SERVICE }} --no-pager -n 50 && exit 1)\",
              \"echo Deploy complete\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "DEPLOY_COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for deploy to complete
        run: |
          # WAR deploy + Tomcat restart can take a few minutes
          aws ssm wait command-executed \
            --command-id "${{ env.DEPLOY_COMMAND_ID }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --cli-read-timeout 300

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ env.DEPLOY_COMMAND_ID }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${{ env.DEPLOY_COMMAND_ID }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text)

          echo "$OUTPUT"

          if [ "$STATUS" != "Success" ]; then
            echo "✗ Deploy failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "${{ env.DEPLOY_COMMAND_ID }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
          echo "✓ Tomcat restarted successfully"

      # ── STEP 4: Smoke test ───────────────────────────────────────────────
      - name: Health check
        run: |
          echo "→ Waiting for OpenMRS to initialize..."
          sleep 30
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "http://${{ secrets.EC2_HOST }}:8080/openmrs" || echo "000")

          echo "→ HTTP response: $HTTP_CODE"
          if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "302" || "$HTTP_CODE" == "301" ]]; then
            echo "✓ OpenMRS is responding"
          else
            echo "✗ Health check failed (HTTP $HTTP_CODE)"
            echo "  Check Tomcat logs via SSM or AWS Console"
            exit 1
          fi

      # ── Cleanup: Remove WAR from S3 staging ──────────────────────────────
      - name: Remove WAR from S3 staging
        if: always()
        run: |
          aws s3 rm s3://${{ secrets.S3_DEPLOY_BUCKET }}/openmrs-deploy/openmrs.war || true
